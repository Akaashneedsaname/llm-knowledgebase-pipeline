services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    ports:
      - "${KB_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d kb"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: llm-knowledgebase-pipeline
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://kb:kb@db:5432/kb
    volumes:
      - ./samples:/app/samples
      - ./output:/app/output
      - model-cache:/cache
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: .
    image: llm-knowledgebase-pipeline
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://kb:kb@db:5432/kb
    ports:
      - "${KB_UI_PORT:-8501}:8501"
    volumes:
      - ./samples:/app/samples
      - ./output:/app/output
      - model-cache:/cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  model-cache:
